name: xlsx-to-json
on:
  push:
    branches: [main]
    paths: [data/kittens.xlsx]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install xlsx@0.18.5 --no-save
      - run: node scripts/xlsx-to-json.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sheets.json
          git diff --cached --quiet || (git commit -m "Auto: regenerate sheets.json from kittens.xlsx" && git push)
